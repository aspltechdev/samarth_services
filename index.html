<!doctype html>
<html lang="en-IN">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website Title -->
    <title>
      Samarth Multi Services | Loans, Insurance, Travel & Business Services
    </title>

    <!-- Primary SEO Meta Tags -->
    <meta
      name="description"
      content="Explore Samarth Multi Services for loans and finance, insurance, travel and tourism, vehicle rentals, courier and cargo, real estate, e-stamp, RTO services, government e-services, and business support."
    />

    <meta
      name="keywords"
      content="Samarth Multi Services, Samarth Groups, Samarth Business Solutions, loans and finance services, personal loans, business loans, loan assistance, insurance services, life insurance, health insurance, general insurance, travel and tourism services, travel booking assistance, vehicle rental services, car rental services, courier services, cargo services, parcel delivery services, real estate services, property assistance, e-stamp services, online e-stamp assistance, RTO services, vehicle registration assistance, driving licence assistance, government e-services, online government services, documentation services, business support services, financial services, multi services company"
    />

    <meta name="author" content="Samarth Multi Services" />

    <meta name="robots" content="index, follow" />

    <meta
      name="googlebot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <meta name="language" content="English" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://samarthmultiservices.in/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#101827" />

    <!-- Open Graph Meta Tags: Facebook, LinkedIn and Social Sharing -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Samarth Multi Services | Loans, Insurance & Business Services"
    />

    <meta
      property="og:description"
      content="Discover loans and finance, insurance, travel, vehicle rentals, courier and cargo, real estate, e-stamp, RTO services, government e-services, and business support with Samarth Multi Services."
    />

    <meta property="og:url" content="https://samarthmultiservices.in/" />

    <meta
      property="og:site_name"
      content="Samarth Multi Services"
    />

    <meta property="og:locale" content="en_IN" />

    <!--
      Optional:
      Add an absolute URL to a suitable website-sharing image.
      Recommended size: 1200 x 630 pixels.
      Replace the path if your actual image is different.
    -->
    <meta
      property="og:image"
      content="https://samarthmultiservices.in/og-image.jpg"
    />

    <meta
      property="og:image:alt"
      content="Samarth Multi Services - Loans, Insurance, Travel and Business Services"
    />

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Samarth Multi Services | Loans, Insurance & Business Services"
    />

    <meta
      name="twitter:description"
      content="Find finance, insurance, travel, vehicle rental, courier, cargo, real estate, e-stamp, RTO and other business services with Samarth Multi Services."
    />

    <meta
      name="twitter:image"
      content="https://samarthmultiservices.in/og-image.jpg"
    />

    <!-- Website Identity -->
    <meta
      name="application-name"
      content="Samarth Multi Services"
    />

    <!-- Google Search Console:
      Add your verification meta tag here if required.

              "@id": "https://samarthmultiservices.in/#organization"
            },
            "inLanguage": "en-IN"
          }
        ]
      }

    <!-- React Application -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
